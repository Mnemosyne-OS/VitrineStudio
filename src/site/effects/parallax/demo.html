<div class="gallery" id="g"><figure><div class="ph"><img class="g0" src="__P1__" alt=""></div></figure><figure><div class="ph"><img class="g0" src="__P2__" alt=""></div></figure><figure><div class="ph"><img class="g0" src="__P3__" alt=""></div></figure><figure><div class="ph"><img class="g0" src="__P4__" alt=""></div></figure><figure><div class="ph"><img class="g0" src="__P5__" alt=""></div></figure><figure><div class="ph"><img class="g0" src="__P6__" alt=""></div></figure></div>
<script>
// A pointer drawn on the card goes round the catalogue: each photo follows at its own depth.
window.play = (fx, demo) => {
  const g = document.getElementById('g');
  fx.gallery(g);
  if (demo.reduced) return;
  const turn = (t) => {
    const r = g.getBoundingClientRect();
    demo.point(g, r.left + r.width * (0.5 + 0.42 * Math.cos(t / 900)), r.top + r.height * (0.5 + 0.38 * Math.sin(t / 700)));
    requestAnimationFrame(turn);
  };
  requestAnimationFrame(turn);
};
</script>
