<script>

  // A catalogue: its filters, then its pieces (the Creations page, or an added catalogue page).

  // A form of her own: each field as the browser's own, its label and whether it is required.

  const fieldHtml = (f, i, all) => {

    const name = esc(twin ? `${f.label} (${twin + 1})` : f.label);

  };
  // Her added pages: a catalogue or a blog is a page like the others; a scenes page is a stage (the route switches it);
  // a text page reads as the About page, a form page as the Contact page.
  (D.pages || []).forEach((p) => {
    if (p.type === 'catalogue') pages.push({ id: p.id, title: p.title, html: gallery(p.creations, p.categories) });
    else if (p.type === 'blog') blog(p.id, p.title, p.posts);
    else if (p.type === 'text') pages.push({ id: p.id, title: p.title, html: `<div class="cols about-${esc(p.layout || 'right')}"><div class="lead rich">${p.html || ''}</div>${p.photo ? `<div class="side"><figure class="portrait page-photo"><img src="${esc(p.photo)}" alt="${esc(p.title)}" loading="lazy" decoding="async"></figure></div>` : ''}</div>` });
    // A form whose answers go nowhere (no e-mail, no Formspree) is never drawn: the page keeps its words alone.
    else if (p.type === 'form') pages.push({ id: p.id, title: p.title, html: `<div class="cols contact-${esc(p.layout || 'left')}">${B.email || B.formspree ? `<form class="mail" data-title="${esc(p.title)}">${p.fields.map(fieldHtml).join('')}<button class="btn">${esc(T.formSend)}</button><p class="form-status" role="status"></p>${B.formspree ? `<p class="form-via">${esc(T.formVia)}</p>` : ''}</form>` : ''}<div class="side">${p.html ? `<div class="rich">${p.html}</div>` : ''}</div></div>` });
  });
  if (B.email || B.formspree || B.instagram || B.contactNote) {
    const ig = B.instagram ? B.instagram.replace(/^@/, '') : '';
    const form = B.email || B.formspree ? `<form class="mail"><label>${esc(T.formName)} <input name="nom" autocomplete="name"></label><label>${esc(T.formEmail)} <input name="email" type="email" autocomplete="email"></label><label>${esc(T.formMessage)} <textarea name="message" rows="4" required></textarea></label><button class="btn">${esc(T.formSend)}</button><p class="form-status" role="status"></p>${B.formspree ? `<p class="form-via">${esc(T.formVia)}</p>` : ''}</form>` : '';
    const side = `${D.contactHtml ? `<div class="rich">${D.contactHtml}</div>` : B.contactNote ? `<p>${esc(B.contactNote)}</p>` : ''}${B.email ? `<p><a href="mailto:${esc(B.email)}">${esc(B.email)}</a></p>` : ''}${(D.socials || []).length ? `<p class="socials">${D.socials.map((s) => `<a href="${esc(s.href)}" rel="noopener" target="_blank" aria-label="${esc(s.name)}" title="${esc(s.name)}">${s.icon}</a>`).join('')}</p>` : ig ? `<p><a href="https://instagram.com/${esc(ig)}" rel="noopener">@${esc(ig)}</a></p>` : ''}`;
    pages.push({ id: 'contact', title: T.contact, html: `<div class="cols contact-${esc(B.contactLayout || 'left')}">${form}<div class="side">${side}</div></div>` });
  }
  // The kit's own pages after the sections: plain links, the route below only reads the hash.
  // The menu in the order she set; a page she did not place keeps its place after them.
  const rank = (id) => { const i = (D.menuOrder || []).indexOf(id); return i < 0 ? 99 : i; };
  const stages = (D.pages || []).filter((p) => p.type === 'scenes');
  document.querySelector('nav').innerHTML = [...pages.filter((p) => !p.sub), ...stages].sort((a, b) => rank(a.id) - rank(b.id)).map((p) => `<a href="#${p.id}">${esc(p.title)}</a>`).join('') + (D.links || []).map((l) => `<a href="${esc(l.href)}">${esc(l.title)}</a>`).join('');
  // The legal notice and the privacy page: out of the menu, reached from the footer on every screen.
  if (D.legal) D.legal.pages.forEach((p) => pages.push({ id: p.id, title: p.title, sub: true, html: `<div class="cols"><div class="lead legal-text">${p.html}</div></div>` }));
  document.getElementById('pages').innerHTML = pages.map((p) => `<section class="page" id="p-${p.id}"><h1>${esc(p.title)}</h1>${p.html}</section>`).join('');
  // The form: through Formspree when the artisan gave her form (the message leaves from the page,
  // nothing is loaded before it is sent); otherwise through the visitor's own mail app.
  // One creation, all its photos: opened from the gallery, closed by its button or Escape.
  const viewer = document.createElement('div');
  viewer.className = 'viewer'; viewer.hidden = true; viewer.setAttribute('role', 'dialog');
  document.body.appendChild(viewer);
  // Her loupe and her frame (studio: Creations ⚙); none of either by default.
  const LOUPE = (D.viewer && D.viewer.loupe) || 'none';
  const FRAME = (D.viewer && D.viewer.frame) || 'none';
  if (FRAME !== 'none') { viewer.classList.add(`frame-${FRAME}`); document.querySelectorAll('.gallery').forEach((g) => g.classList.add(`frame-${FRAME}`)); }
  // The loupe reads the large copy of the picture; a touch screen zooms on a tap, a second tap comes back.
  function armLoupe(c, k) {
    if (LOUPE === 'none') return;
    const main = viewer.querySelector('.v-main');
    const img = main && main.querySelector('img');
    if (!img) return;
    const big = (c.zoom && c.zoom[k]) || c.images[k];
    const Z = 2.6;
    // Where the picture is drawn inside its box (object-fit leaves margins; a mat adds padding).
    const box = () => {
      const r = img.getBoundingClientRect(), cs = getComputedStyle(img);

      const bw = r.width - pl - (parseFloat(cs.paddingRight) || 0), bh = r.height - pt - (parseFloat(cs.paddingBottom) || 0);
      const nw = img.naturalWidth || bw, nh = img.naturalHeight || bh, sc = Math.min(bw / nw, bh / nh), w = nw * sc, h = nh * sc;
      return { x: r.left + pl + (bw - w) / 2, y: r.top + pt + (bh - h) / 2, w, h };
    };
    const touch = matchMedia('(hover: none)').matches;
    if (LOUPE === 'zoom' || touch) {
      main.classList.add('loupe-zoom');
      const at = (e) => { const b = box(); img.style.transformOrigin = `${Math.max(0, Math.min(100, ((e.clientX - b.x) / b.w) * 100))}% ${Math.max(0, Math.min(100, ((e.clientY - b.y) / b.h) * 100))}%`; };
      const sharp = () => { if (!img.dataset.big) { img.dataset.big = '1'; img.src = big; } };
      if (touch) { img.addEventListener('click', (e) => { e.stopPropagation(); sharp(); at(e); img.classList.toggle('zoomed'); }); return; }
      img.addEventListener('pointerenter', (e) => { sharp(); at(e); img.classList.add('zoomed'); });
      img.addEventListener('pointermove', at);
      img.addEventListener('pointerleave', () => img.classList.remove('zoomed'));
      return;
    }

    main.appendChild(lens);
    main.addEventListener('pointermove', (e) => {
      const b = box(), x = e.clientX - b.x, y = e.clientY - b.y;
      if (x < 0 || y < 0 || x > b.w || y > b.h) { lens.classList.remove('on'); return; }

  }
  // A piece shown with nothing to say (no name, price, size or words): its photo alone,

      + (bare ? '' : `<div class="v-info">${c.name ? `<h2>${esc(c.name)}</h2>` : ''}${c.price ? `<p class="v-price">${esc(c.price)}${(c.priceAlso || []).length ? `<small class="v-also">${c.priceAlso.map(esc).join(' · ')}</small>` : ''}</p>` : ''}${(c.specs || []).length ? `<table class="v-specs">${c.specs.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>` : c.dimensions || c.weight ? `<p class="v-dim">${[c.dimensions, c.weight].filter(Boolean).map(esc).join(' · ')}</p>` : ''}${c.description ? `<p>${esc(c.description)}</p>` : ''}</div>`)
      + (many ? '<button class="v-step prev" data-step="-1" aria-label="‹">‹</button><button class="v-step next" data-step="1" aria-label="›">›</button>' : '')
      + `<button class="v-close">${esc(T.close)} ✕</button>`;
    viewer.querySelectorAll('.v-thumbs button').forEach((b) => (b.onclick = () => openViewer(c, +b.dataset.k)));
    viewer.querySelectorAll('.v-step').forEach((b) => (b.onclick = () => stepViewer(+b.dataset.step)));
    viewer.querySelector('.v-close').onclick = closeViewer;
    armLoupe(c, k);
    // A bare photo closes from its dark ground too, as a gallery does.

    viewer.hidden = false;
  }

  // The viewer's own keys, before the page's: Escape closes it (not the page under it), the arrows go from piece to piece.

  document.querySelectorAll('.cats button').forEach((b) => b.addEventListener('click', () => {
    const cat = b.dataset.cat;

    f.addEventListener('click', () => openViewer(c));

  // Every form of the site (Contact, and her form pages) sends the same way; a form page's answers carry its name.
  document.querySelectorAll('form.mail').forEach((mail) => mail.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!B.formspree) {
      const body = mail.dataset.title ? [...f.entries()].map(([k, v]) => `${k} : ${v}`).join('\n') : `${f.get('message') || ''}\n\n${f.get('nom') || ''}${f.get('email') ? ` · ${f.get('email')}` : ''}`;

    const button = mail.querySelector('button');

  let r = 0, v = 0, want = 0, busy = false, current = null, timers = [];
  const pad2 = (n) => String(n).padStart(2, '0');
  const pic = (img, cls, alt, first) => (img ? `<img class="${cls}" src="${esc(src(img))}" alt="${esc(alt)}" decoding="async" fetchpriority="${first ? 'high' : 'auto'}">` : '');

  // A caption moved by hand: its centre per screen, a screen never set taking the larger one's.
  function capStyle(pos) {

    return v ? ` style="${v}"` : '';
  }

  // ── A living scene: layers over the place, set on the cropped picture ──
  const lay = (L, cls) => (L ? `<img class="${cls}" src="${esc(src(L))}" alt="" decoding="async" style="left:${+L.x}%;top:${+L.y}%;width:${+L.w}%;height:${+L.h}%">` : '');
  function livingRoom(s, alt) {
    const L = s.layers;
    const a = L.potAlive;
    // The shadows lie on the room, so they move with it; only the piece and the life come forward.
    return `<div class="lay"><div class="lb"><img class="lplace sa" src="${esc(src(L.room || s.images.place))}" alt="${esc(T.generated)}" decoding="async" fetchpriority="high">${lay(L.shadowPiece, 'lps')}${lay(L.shadowAlive, 'las')}</div>`
      + `<div class="lg">${lay(L.pot, 'lp')}`
      + `<canvas class="la" role="img" aria-label="${esc(alt)}" data-src="${esc(src(a))}"${L.sway ? ` data-sway="${esc(src(L.sway))}"` : ''} style="left:${+a.x}%;top:${+a.y}%;width:${+a.w}%;height:${+a.h}%"></canvas></div>`
      + `<div class="sun"></div></div>`;
  }
  // The box the cropped picture fills: object-fit cover, centred across, 70 % down (as .room img).
  function fitLay(el) {
    const box = el.querySelector('.lay'), img = box && box.querySelector('.lplace');
    if (!box || !img || !img.naturalWidth) return;
    const rw = el.clientWidth, rh = el.clientHeight, r = img.naturalWidth / img.naturalHeight;
    const w = rw / rh > r ? rw : rh * r, h = w / r;
    Object.assign(box.style, { width: w + 'px', height: h + 'px', left: (rw - w) * 0.5 + 'px', top: (rh - h) * 0.7 + 'px', right: 'auto', bottom: 'auto' });
    box.classList.add('fit');
  }
  // The life drawn on its canvas; it sways only in the scene on screen, and never for who asked for less motion.
  function wakeLife(el) {
    const c = el.querySelector('canvas.la');
    if (!c || c.dataset.ready) return;
    c.dataset.ready = '1';
    const load = (u) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = u; });
    Promise.all([load(c.dataset.src), c.dataset.sway ? load(c.dataset.sway) : null]).then(([img, map]) => {
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      if (!map || reduced) return;
      const base = ctx.getImageData(0, 0, c.width, c.height);
      ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(map, 0, 0, c.width, c.height);
      const m = ctx.getImageData(0, 0, c.width, c.height).data;
      ctx.putImageData(base, 0, 0);
      c._sway = { ctx, base, m, out: ctx.createImageData(c.width, c.height) };
    }).catch(() => { c.dataset.ready = ''; });
  }
  let swayClock = 0, swayLast = 0;
  function swayTick(t) {
    swayClock = requestAnimationFrame(swayTick);
    // About 30 images a second, and nothing while the page is hidden.
    if (t - swayLast < 33 || document.hidden) return;
    swayLast = t;
    const c = current && current.classList.contains('alive') ? current.querySelector('canvas.la') : null;
    const sw = c && c._sway;
    if (!sw) return;
    const { ctx, base, m, out } = sw, w = base.width, h = base.height, d = base.data;
    const S = 0.05 * w * Math.sin(t / 700), o = out.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, sx = Math.min(w - 1, Math.max(0, x + Math.round(S * (m[i] / 255 - 0.5)))), j = (y * w + sx) * 4;
      o[i] = d[j]; o[i + 1] = d[j + 1]; o[i + 2] = d[j + 2]; o[i + 3] = d[j + 3];
    }
    ctx.putImageData(out, 0, 0);
  }
  if (!reduced && [HOME_ROWS, ...STAGES.map((st) => st.rows)].some((rows) => rows.some((row) => row.scenes.some((s) => s.layers && s.layers.sway)))) swayClock = requestAnimationFrame(swayTick);
  // The pointer moves the room a little against it and the piece a little with it: two depths.
  if (!reduced) {
    stage.addEventListener('pointermove', (e) => {
      if (!current || e.pointerType !== 'mouse') return;
      const r = current.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * 2 - 1, py = (e.clientY - r.top) / r.height * 2 - 1;
      const b = current.querySelector('.lb'), g = current.querySelector('.lg');
      if (b) b.style.transform = `scale(1.04) translate(${-px * 10}px, ${-py * 6}px)`;
      if (g) g.style.transform = `scale(1.04) translate(${px * 14}px, ${py * 8}px)`;
    });
  }
  stage.addEventListener('pointerleave', () => {
    if (!current) return;
    const b = current.querySelector('.lb'), g = current.querySelector('.lg');
    if (b) b.style.transform = '';
    if (g) g.style.transform = '';
  });
  addEventListener('resize', () => { if (current) fitLay(current); });

  function cellEl(ri, vi) {
    const row = ROWS[ri], s = row.scenes[vi];
    const el = document.createElement('section');
    el.className = 'cell';
    // Every staged picture says it is generated in its alt (doc 145 §5); on screen when she chose it.
    const alt = `${s.piece} · ${T.generated}`;
    el.innerHTML = `<div class="room">${s.layers ? livingRoom(s, alt) : `${pic(s.images.place, 'sa', T.generated, true)}${pic(s.images.piece, 'sb', alt)}${pic(s.images.alive, 'sc', alt)}`}${s.clip ? `<video class="sv" muted playsinline preload="auto" src="${esc(s.clip)}"${s.cut ? ` data-in="${+s.cut.in}" data-out="${+s.cut.out}"` : ''}></video>` : ''}</div>`
      + `<div class="meta"><div class="index"><b>${pad2(ri + 1)}.${vi + 1}</b> / ${pad2(ROWS.length)}.${row.scenes.length}</div><div class="variant">${esc(s.name)}</div>`
      + `<ol class="steps"><li data-s="1">${esc(T.place)}</li><li data-s="2">${esc(T.piece)}</li><li data-s="3">${esc(T.alive)}</li></ol>${CREDIT}</div>`
      + `<h2 class="roomname">${esc(row.name)}</h2>`
      + (s.caption ? `<div class="cap cap-${esc(s.caption.place)} cap-anim-${esc(s.caption.anim || 'rise')}${s.caption.pos ? ' free' : ''}"${capStyle(s.caption.pos)}>${[...(s.caption.title ? [`<b>${esc(s.caption.title)}</b>`] : []), ...s.caption.lines.map((l) => `<span>${esc(l)}</span>`)].map((h, i) => h.replace(/^<(b|span)>/, `<$1 style="--i:${i}">`)).join('')}</div>` : '');
    return el;
  }
  // The three beats of a scene: the place, the piece, the living.
  function play(el) {
    timers.forEach(clearTimeout); timers = [];
    prefetch();
    const step = (n, cls, ms) => timers.push(setTimeout(() => { el.classList.add(cls); el.querySelector(`.steps [data-s="${n}"]`).classList.add('on'); }, reduced ? 0 : ms));
    // A living scene sets its layers on the cropped picture once the place is known.
    const pl = el.querySelector('.lplace');
    if (pl) {
      const fit = () => fitLay(el); pl.complete ? fit() : pl.addEventListener('load', fit, { once: true }); wakeLife(el);
      // No beats for a living scene: it is shown alive from the start (the cut would show between them).
      el.classList.add('living', 'lit', 'piece', 'alive');
      el.querySelectorAll('.steps li').forEach((li) => li.classList.add('on'));
      return;
    }
    step(1, 'lit', 50);
    step(2, 'piece', 500);
    // With a clip, the living GROWS (the clip ends on its last frame); without, it dissolves in.
    timers.push(setTimeout(() => {
      const vid = el.querySelector('video.sv');
      el.querySelector('.steps [data-s="3"]').classList.add('on');
      if (vid && !reduced && vid.readyState >= 2) {
        el.classList.add('growing');
        vid.currentTime = +vid.dataset.in || 0;
        vid.play().catch(() => { el.classList.remove('growing'); el.classList.add('alive'); });
        vid.onended = () => el.classList.add('alive');
        // A cut clip stops at the end of the part she kept.
        const out = +vid.dataset.out;
        vid.ontimeupdate = out ? () => { if (vid.currentTime >= out) { vid.pause(); el.classList.add('alive'); } } : null;
      } else el.classList.add('alive');
    }, reduced ? 0 : 1600));
  }
  // Warm the cache for the neighbours, so a move never shows an empty room.
  function prefetch() {
    const near = [[r - 1, v], [r + 1, v], [r, v - 1], [r, v + 1]].map(([a, b]) => { const row = ROWS[mod(a, ROWS.length)]; return row.scenes[mod(b, row.scenes.length)]; });
    // A living room's own picture and layers too: it shows no picture of the scene.
    const files = (s) => [...Object.values(s.images), ...(s.layers ? [s.layers.room, s.layers.potAlive, s.layers.shadowAlive, s.layers.pot, s.layers.shadowPiece] : [])];
    const go = () => near.forEach((s) => files(s).forEach((img) => { if (img) { const i = new Image(); i.fetchPriority = 'low'; i.src = src(img); } }));
    'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 2000 }) : setTimeout(go, 600);
  }
  function render(dr, dv) {
    const next = cellEl(r, v);
    if (!current || (!dr && !dv) || reduced) { stage.replaceChildren(next); current = next; play(next); sync(); return; }
    busy = true;
    const ax = dv ? 'X' : 'Y', dir = dv || dr;
    next.style.transition = 'none'; next.style.transform = `translate${ax}(${dir * 100}%)`;
    stage.appendChild(next); next.getBoundingClientRect();
    next.style.transition = ''; next.style.transform = 'none';
    current.style.transform = `translate${ax}(${-dir * 100}%)`;
    const old = current; current = next; sync();
    setTimeout(() => { old.remove(); play(next); busy = false; }, DUR);
  }
  function go(dr, dv) {
    if (busy || document.body.classList.contains('paged')) return;
    r = mod(r + dr, ROWS.length);
    if (dr) v = Math.min(want, ROWS[r].scenes.length - 1);
    else { v = mod(v + dv, ROWS[r].scenes.length); want = v; }
    history.replaceState(null, '', `#${here()}${r + 1}/${v + 1}`);
    document.querySelector('.first-hint')?.classList.add('gone');
    render(dr, dv);
  }
  function jump(ri, vi) { if (busy || (ri === r && vi === v)) return; const dr = Math.sign(ri - r), dv = ri === r ? Math.sign(vi - v) : 0; r = ri; v = vi; want = vi; history.replaceState(null, '', `#${here()}${r + 1}/${v + 1}`); render(dr, dv); }
  function here() { return stageId ? `${stageId}/` : ''; }
  function sync() {
    const row = ROWS[r];
    const h = (sel, txt, show) => { const b = document.querySelector(sel); b.textContent = txt; b.style.visibility = show ? '' : 'hidden'; };
    h('.hint.up', '↑ ' + ROWS[mod(r - 1, ROWS.length)].name, ROWS.length > 1);
    h('.hint.down', ROWS[mod(r + 1, ROWS.length)].name + ' ↓', ROWS.length > 1);
    h('.hint.left', '← ' + row.scenes[mod(v - 1, row.scenes.length)].name, row.scenes.length > 1);
    h('.hint.right', row.scenes[mod(v + 1, row.scenes.length)].name + ' →', row.scenes.length > 1);
    document.querySelectorAll('.map button').forEach((b) => b.setAttribute('aria-current', +b.dataset.r === r && +b.dataset.v === v));
    document.querySelectorAll('.map-row span').forEach((s, i) => s.classList.toggle('on', i === r));
  }
  const map = document.querySelector('.map');
  const mapStyle = (D.sceneMap && D.sceneMap.style) || 'dots';
  map.classList.add(`m-${mapStyle}`);
  if (D.sceneMap && D.sceneMap.color) map.style.setProperty('--map-color', D.sceneMap.color);
  const thumb = (s) => { const im = s.images.place || s.images.piece || s.images.alive; return mapStyle === 'thumbs' && im ? `<img src="${esc(im.s)}" alt="" loading="lazy" decoding="async">` : ''; };
  function drawMap() {
  map.style.setProperty('--cols', String(Math.max(...ROWS.map((row) => row.scenes.length))));
  map.innerHTML = ROWS.map((row, ri) => `<div class="map-row"><span>${esc(row.name)}</span>${row.scenes.map((s, vi) => `<button data-r="${ri}" data-v="${vi}" data-n="${vi + 1}" title="${esc(row.name)} · ${esc(s.name)}" aria-label="${esc(row.name)} · ${esc(s.name)}">${thumb(s)}</button>`).join('')}</div>`).join('');
  map.querySelectorAll('button').forEach((b) => (b.onclick = () => jump(+b.dataset.r, +b.dataset.v)));
  }
  drawMap();
  // Another stage: its rooms, its map, from its first scene; the menu marks it.
  function switchStage(id) {
    const p = STAGES.find((x) => x.id === id);
    ROWS = p ? p.rows : HOME_ROWS; stageId = p ? id : '';
    r = 0; v = 0; want = 0; current = null;
    drawMap();
    document.querySelectorAll('nav a').forEach((a) => (stageId && a.hash === '#' + stageId ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  }
  document.querySelectorAll('.hint').forEach((b) => (b.onclick = () => go(+b.dataset.dr, +b.dataset.dv)));

  // The home film: one gesture down (wheel, key, swipe, button) or its end enters the scenes.
  // Its parts are the studio's clips, played one after the other from each cut's start to its end.
  const intro = document.getElementById('intro');
  const hasFilm = !!(D.film && D.film.clips.length);
  let inIntro = false, vids = [];
  if (hasFilm) {
    intro.hidden = false;
    const kicker = B.tagline ? `<p class="intro-kicker">${esc(B.tagline)}</p>` : '';
    const line = B.introLine ? `<p class="intro-line">${lines(B.introLine)}</p>` : '';
    intro.setAttribute('aria-label', B.name);
    intro.innerHTML = `<img src="${esc(SMALL ? D.film.poster.s : D.film.poster.l)}" alt="${esc(B.name)} · ${esc(T.generated)}">`
      + (kicker || line ? `<div class="intro-text">${kicker}${line}</div>` : '')
      + `${CREDIT}<button class="intro-enter" type="button">${esc(T.enter)} ↓</button>`;
    vids = D.film.clips.map((c) => {
      const el = document.createElement('video'); el.muted = true; el.playsInline = true; el.preload = 'none'; el.src = c;
      intro.insertBefore(el, intro.querySelector('.intro-text, .intro-enter'));
      return el;
    });
    intro.querySelector('.intro-enter').onclick = () => leaveIntro();
  } else document.body.classList.add('intro-gone');
  const cuts = (D.film && D.film.cuts) || [];
  function startPart(i) {
    const el = vids[i];
    if (!inIntro) return;
    if (!el) { setTimeout(leaveIntro, 1500); return; }
    // Fetch the next clip while this one plays, or each cut shows a gap.
    if (vids[i + 1] && vids[i + 1].preload !== 'auto') { vids[i + 1].preload = 'auto'; vids[i + 1].load(); }
    // A start asked again (a tab seen later, the film shown again) replaces the earlier one: its watchers stand down.
    const run = (el.dataset.run = String(Number(el.dataset.run || 0) + 1));
    let done = false;
    const next = () => { if (done || el.dataset.run !== run) return; done = true; startPart(i + 1); };
    el.onended = next;
    const cut = cuts[i];
    el.currentTime = cut ? cut.in : 0;
    if (cut) {
      // On to the next part at its end: frame by frame where the browser draws frames,
      // and on every time update too (frames are held back in a window not seen).
      const at = (t) => { if (done || el.dataset.run !== run) return true; if (t >= cut.out - 0.02) { el.pause(); next(); return true; } return false; };
      if (el.requestVideoFrameCallback) { const watch = (_n, m) => { if (!at(m.mediaTime)) el.requestVideoFrameCallback(watch); }; el.requestVideoFrameCallback(watch); }
      el.ontimeupdate = () => at(el.currentTime);
    }
    // A clip that cannot play ends the film rather than freezing on it.
    el.onerror = () => leaveIntro();
    // A refused play is not a broken film: a tab opened in the background
    // is not allowed to play yet, so it starts when it is seen. Any other
    // refusal (a phone saving power) keeps the first picture and the button.
    el.play().then(() => { el.classList.add('on'); vids.forEach((o, k) => { if (k !== i) setTimeout(() => o.classList.remove('on'), 300); }); }, () => {
      if (!document.hidden) return;
      const seen = () => { if (document.hidden) return; document.removeEventListener('visibilitychange', seen); startPart(i); };
      document.addEventListener('visibilitychange', seen);
    });
  }
  function showIntro() {
    if (!hasFilm) return;
    inIntro = true;
    document.body.classList.remove('intro-gone');
    if (reduced) return;
    vids.forEach((o) => o.classList.remove('on'));
    vids[0].preload = 'auto';
    startPart(0);
  }
  function leaveIntro() {
    if (!inIntro) return;
    inIntro = false;
    document.body.classList.add('intro-gone');
    setTimeout(() => { if (!inIntro) vids.forEach((o) => o.pause()); }, 900);
    history.replaceState(null, '', `#${r + 1}/${v + 1}`);
    if (current) {
      current.classList.remove('lit', 'piece', 'alive', 'growing');
      current.querySelectorAll('.steps li').forEach((li) => li.classList.remove('on'));
      play(current);
    }
  }
  let it0 = null;
  intro.addEventListener('touchstart', (e) => { it0 = e.touches[0]; }, { passive: true });
  intro.addEventListener('touchend', (e) => { if (it0 && it0.clientY - e.changedTouches[0].clientY > 40) leaveIntro(); it0 = null; });

  // Wheel: one gesture = one scene. Trackpad inertia is swallowed until the wheel goes quiet.
  let acc = 0, quiet = null, gestureDone = false;
  addEventListener('wheel', (e) => {
    if (inIntro) {
      e.preventDefault();
      if (e.deltaY > 10) { leaveIntro(); gestureDone = true; clearTimeout(quiet); quiet = setTimeout(() => { acc = 0; gestureDone = false; }, 400); }
      return;
    }
    if (document.body.classList.contains('paged')) return;
    e.preventDefault();
    clearTimeout(quiet); quiet = setTimeout(() => { acc = 0; gestureDone = false; }, 180);
    if (gestureDone || busy) return;
    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
    acc += horiz ? (e.deltaX || e.deltaY) : e.deltaY;
    if (Math.abs(acc) > 40) { gestureDone = true; horiz ? go(0, Math.sign(acc)) : go(Math.sign(acc), 0); }
  }, { passive: false });
  addEventListener('keydown', (e) => {
    if (inIntro) { if (['ArrowDown', 'Enter', ' '].includes(e.key)) { e.preventDefault(); leaveIntro(); } return; }
    if (e.key === 'Escape') return viewer.hidden ? closePage() : closeViewer();
    const k = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (k && !document.body.classList.contains('paged') && !(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement)) { e.preventDefault(); go(...k); }
  });
  let t0 = null;
  stage.addEventListener('touchstart', (e) => { t0 = e.touches[0]; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
    Math.abs(dx) > Math.abs(dy) ? go(0, dx < 0 ? 1 : -1) : go(dy < 0 ? 1 : -1, 0);
  });

  function openPage(id) {
    document.querySelectorAll('.page').forEach((p) => p.classList.toggle('open', p.id === 'p-' + id));
    document.querySelectorAll('nav a').forEach((a) => (a.hash === '#' + id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    document.body.classList.add('paged');
  }
  function closePage() {
    document.querySelectorAll('.page').forEach((p) => p.classList.remove('open'));
    document.querySelectorAll('nav a').forEach((a) => a.removeAttribute('aria-current'));
    document.body.classList.remove('paged');
    history.replaceState(null, '', `#${here()}${r + 1}/${v + 1}`);
  }
  document.querySelector('[data-close]').onclick = closePage;
  // No hash (or #accueil, the logo's link): the film, when there is one. A link to a scene or a page goes straight there.
  function route() {
    const h = location.hash.slice(1);
    if (!h || h === 'accueil') {
      if (document.body.classList.contains('paged')) closePage();
      if (stageId) { switchStage(''); render(0, 0); }
      if (!current) render(0, 0);
      return showIntro();
    }
    if (inIntro) { inIntro = false; vids.forEach((o) => o.pause()); }
    document.body.classList.add('intro-gone');
    if (pages.some((p) => p.id === h)) return openPage(h);
    if (document.body.classList.contains('paged')) closePage();
    // An added scenes page, alone or with a position: #<page> or #<page>/2/3.
    const parts = h.split('/');
    const onStage = STAGES.some((p) => p.id === parts[0]) ? parts.shift() : '';
    if (onStage !== stageId) { switchStage(onStage); if (!parts.length) return render(0, 0); }
    const [a, b] = parts.map((x) => parseInt(x, 10) - 1);
    if (Number.isInteger(a) && ROWS[a]) {
      const vi = Math.min(Math.max(Number.isInteger(b) ? b : 0, 0), ROWS[a].scenes.length - 1);
      if (current) return jump(a, vi);
      r = a; v = vi; want = vi;
    }
    if (!current) render(0, 0);
  }
  addEventListener('hashchange', route);
  route();
})().catch((err) => {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">This site could not load its content (data.json).</p>';
  console.error(err);
});
</script>
</body>
</html>
