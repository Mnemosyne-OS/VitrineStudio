    inIntro = true;
    document.body.classList.remove('intro-gone');
    if (reduced) return;
    vids.forEach((o) => o.classList.remove('on'));
    vids[0].preload = 'auto';
    startPart(0);
  }
  function leaveIntro() {
    if (!inIntro) return;
    inIntro = false;
    document.body.classList.add('intro-gone');
    setTimeout(() => { if (!inIntro) vids.forEach((o) => o.pause()); }, 900);
    put(`${HOME}#${r + 1}/${v + 1}`);
    if (current) {
      current.classList.remove('lit', 'piece', 'alive', 'growing');
      current.querySelectorAll('.steps li').forEach((li) => li.classList.remove('on'));
      play(current);
    }
  }
  let it0 = null;
  intro.addEventListener('touchstart', (e) => { it0 = e.touches[0]; }, { passive: true });
  intro.addEventListener('touchend', (e) => { if (it0 && it0.clientY - e.changedTouches[0].clientY > 40) leaveIntro(); it0 = null; });

  // Wheel: one gesture = one scene. Trackpad inertia is swallowed until the wheel goes quiet.
  let acc = 0, quiet = null, gestureDone = false;
  addEventListener('wheel', (e) => {
    if (inIntro) {
      e.preventDefault();
      if (e.deltaY > 10) { leaveIntro(); gestureDone = true; clearTimeout(quiet); quiet = setTimeout(() => { acc = 0; gestureDone = false; }, 400); }
      return;
    }
    if (document.body.classList.contains('paged')) return;
    e.preventDefault();
    clearTimeout(quiet); quiet = setTimeout(() => { acc = 0; gestureDone = false; }, 180);
    if (gestureDone || busy) return;
    const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
    acc += horiz ? (e.deltaX || e.deltaY) : e.deltaY;
    if (Math.abs(acc) > 40) { gestureDone = true; horiz ? go(0, Math.sign(acc)) : go(Math.sign(acc), 0); }
  }, { passive: false });
  addEventListener('keydown', (e) => {
    if (inIntro) { if (['ArrowDown', 'Enter', ' '].includes(e.key)) { e.preventDefault(); leaveIntro(); } return; }
    if (e.key === 'Escape') return viewer.hidden ? closePage() : closeViewer();
    const k = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (k && !document.body.classList.contains('paged') && !(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement)) { e.preventDefault(); go(...k); }
  });
  let t0 = null;
  stage.addEventListener('touchstart', (e) => { t0 = e.touches[0]; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;
    Math.abs(dx) > Math.abs(dy) ? go(0, dx < 0 ? 1 : -1) : go(dy < 0 ? 1 : -1, 0);
  });

  function openPage(id) {
    document.querySelectorAll('.page').forEach((p) => p.classList.toggle('open', p.id === 'p-' + id));
    const opened = document.getElementById('p-' + id);
    if (opened) fx('page', opened);
    document.querySelectorAll('nav a').forEach((a) => (a.dataset.id !== undefined && a.dataset.id === id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    document.body.classList.add('paged');
  }
  function closePage() {
    document.querySelectorAll('.page').forEach((p) => p.classList.remove('open'));
    document.querySelectorAll('nav a').forEach((a) => a.removeAttribute('aria-current'));
    document.body.classList.remove('paged');
    put(`${HOME}#${here()}${r + 1}/${v + 1}`);
    // A visitor who arrived on a page's own address has no room drawn behind it yet.
    if (!current) render(0, 0);
    headNow();
  }
  document.querySelector('[data-close]').onclick = closePage;
  // No hash (or #accueil, the logo's link): the film, when there is one. A link to a scene or a page goes straight there.
  function route() {
    const h = idNow();
    if (openCreation(h, openPage)) { if (inIntro) { inIntro = false; vids.forEach((o) => o.pause()); } document.body.classList.add('intro-gone'); return; }
    if (!h || h === 'accueil') {
      if (document.body.classList.contains('paged')) closePage();
      if (stageId) { switchStage(''); render(0, 0); }
      if (!current) render(0, 0);
      return showIntro();
    }
    if (inIntro) { inIntro = false; vids.forEach((o) => o.pause()); }
    document.body.classList.add('intro-gone');
    if (pages.some((p) => p.id === h)) return openPage(h);
    if (document.body.classList.contains('paged')) closePage();
    // An added scenes page, alone or with a position: #<page> or #<page>/2/3.
    const parts = h.split('/');
    const onStage = STAGES.some((p) => p.id === parts[0]) ? parts.shift() : '';
    if (onStage !== stageId) { switchStage(onStage); if (!parts.length) return render(0, 0); }
    const [a, b] = parts.map((x) => parseInt(x, 10) - 1);
    if (Number.isInteger(a) && ROWS[a]) {
      const vi = Math.min(Math.max(Number.isInteger(b) ? b : 0, 0), ROWS[a].scenes.length - 1);
      if (current) return jump(a, vi);
      r = a; v = vi; want = vi;
    }
    if (!current) render(0, 0);
  }
  // One reading per address: a click on a real link and the browser's own event may both ask.
  const routeOnce = () => {
    if (routedAt === location.href) return;
    route();
    // A link from before the real addresses (#creations) settles on the page's own.
    const h = location.hash.slice(1);
    if (REAL && h && h in PATHS) history.replaceState(null, '', addr(h));
    seen();
  };
  addEventListener('hashchange', routeOnce);
  routeOnce();
})().catch((err) => {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">This site could not load its content (data.json).</p>';
  console.error(err);
});
